[General]
network = NetworkTopology
sim-time-limit = 60s
cpu-time-limit = 300s
debug-on-errors = true
record-eventlog = true

# OSPF-TE vs RIP Comparison Simulation
# This simulation compares OSPF-TE and RIP routing protocols
# with different traffic types (video, voice, data)

[Config OSPF_TE_Scenario]
description = "OSPF-TE with Traffic Engineering"
network = NetworkTopology
sim-time-limit = 60s

# OSPF-TE Router Configuration
**.ospfRouter*.ospfAreaId = "0.0.0.0"
**.ospfRouter*.helloInterval = 10
**.ospfRouter*.deadInterval = 40
**.ospfRouter*.teEnabled = true
**.ospfRouter*.bandwidthWeight = 1.0
**.ospfRouter*.delayWeight = 1.0
**.ospfRouter*.loadWeight = 1.0
**.ospfRouter*.tedUpdateInterval = 30

# Traffic Configuration
**.videoTraffic.packetLength = 1500
**.videoTraffic.sendInterval = exponential(0.033s)
**.videoTraffic.startTime = uniform(0s, 1s)
**.videoTraffic.stopTime = 60

**.voiceTraffic.packetLength = 160
**.voiceTraffic.sendInterval = 0.02
**.voiceTraffic.startTime = uniform(0s, 1s)
**.voiceTraffic.stopTime = 60

**.dataTraffic.packetLength = 512
**.dataTraffic.sendInterval = exponential(0.1s)
**.dataTraffic.startTime = uniform(0s, 1s)
**.dataTraffic.stopTime = 60

# Performance Monitoring
**.perfMonitor.measurementInterval = 1
**.perfMonitor.outputFile = "ospf_te_results.vec"
**.perfMonitor.statisticsFile = "ospf_te_stats.sca"

[Config RIP_Scenario]
description = "RIP with Hop Count Routing"
network = NetworkTopology
sim-time-limit = 60s

# RIP Router Configuration
**.ripRouter*.updateInterval = 30
**.ripRouter*.invalidTimer = 180
**.ripRouter*.flushTimer = 240
**.ripRouter*.maxHopCount = 15

# Same traffic configuration as OSPF-TE
**.videoTraffic.packetLength = 1500
**.videoTraffic.sendInterval = exponential(0.033s)
**.videoTraffic.startTime = uniform(0s, 1s)
**.videoTraffic.stopTime = 60

**.voiceTraffic.packetLength = 160B
**.voiceTraffic.sendInterval = 0.02
**.voiceTraffic.startTime = uniform(0s, 1s)
**.voiceTraffic.stopTime = 60

**.dataTraffic.packetLength = 512
**.dataTraffic.sendInterval = exponential(0.1s)
**.dataTraffic.startTime = uniform(0s, 1s)
**.dataTraffic.stopTime = 60

# Performance Monitoring
**.perfMonitor.measurementInterval = 1
**.perfMonitor.outputFile = "rip_results.vec"
**.perfMonitor.statisticsFile = "rip_stats.sca"

[Config HighLoad_Scenario]
description = "High Load Network Conditions"
network = NetworkTopology
sim-time-limit = 60s

# Increase traffic load
**.videoTraffic.sendInterval = exponential(0.016s)  # Double the video rate
**.voiceTraffic.sendInterval = 0.01  # Double the voice rate
**.dataTraffic.sendInterval = exponential(0.05s)  # Double the data rate

# OSPF-TE should handle this better than RIP
**.ospfRouter*.tedUpdateInterval = 15  # More frequent updates
**.ospfRouter*.loadWeight = 2.0  # Higher weight on load

[Config LinkFailure_Scenario]
description = "Link Failure and Recovery"
network = NetworkTopology
sim-time-limit = 60s

# Simulate link failure at 30 seconds
**.ospfRouter1.ethg[0].channel.datarate = 0bps  # Link failure
**.ripRouter1.ethg[0].channel.datarate = 0bps   # Link failure

# OSPF-TE should converge faster than RIP

[Config BandwidthVariation_Scenario]
description = "Variable Bandwidth Links"
network = NetworkTopology
sim-time-limit = 60s

# Vary link bandwidths to test TE capabilities
**.ospfRouter1.ethg[0].channel.datarate = 100Mbps
**.ospfRouter2.ethg[0].channel.datarate = 1Gbps
**.ospfRouter3.ethg[0].channel.datarate = 500Mbps

# OSPF-TE should route through higher bandwidth paths
